# Note: Create the Nexus registry pull secret once in the cluster:
#   kubectl create secret docker-registry nexus-registry-secret \
#     --namespace cstad-devops \
#     --docker-server=docker.devops.cstad.edu.kh \
#     --docker-username=<NEXUS_USER> \
#     --docker-password=<NEXUS_PASS> \
#     --docker-email=devops-admin@devops.cstad.edu.kh
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
  namespace: cstad-devops
  labels:
    app: cstad-frontend
type: Opaque
stringData:
  FRONTEND_INTERNAL_TOKEN: "cstad-frontend-session-secret-2026"

