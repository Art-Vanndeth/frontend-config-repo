apiVersion: apps/v1
kind: Deployment
metadata:
  name: cstad-frontend
  namespace: cstad-devops
  labels:
    app: cstad-frontend
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cstad-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cstad-frontend
        tier: frontend
    spec:
      imagePullSecrets:
        - name: nexus-registry-secret
      containers:
        - name: frontend
          image: docker.devops.cstad.edu.kh/cstad-frontend:v1.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: frontend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

