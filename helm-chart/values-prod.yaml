replicaCount: 3
environment: prod

service:
  type: NodePort
  nodePort: 30080

config:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://api.devops.cstad.edu.kh"

ingress:
  enabled: true
  host: app.devops.cstad.edu.kh
  tlsSecretName: cstad-frontend-tls
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

